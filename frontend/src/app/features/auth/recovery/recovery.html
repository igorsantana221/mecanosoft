<div
    class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Atmospheric Background Layer -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <!-- Abstract architectural texture -->
        <div class="absolute inset-0 opacity-10 bg-cover bg-center mix-blend-multiply"
            style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDZ6BVa7IGPOvU718UjUgVAX0xu0uknpkqyT3a60eobEXTMh856-RudyxJ2UFptPfcgsMvjCk66ghkk2sEfnb7o_7MLjCYg8_HMQSIs9pRUIcDrCanvaiRU-OrCA0yqdnl67xXj34SHI4v6QjlWjl2YiC-PYXmW-sUGBQzjdYOCcLixg8LJ1VT8GEp9SrbeWDv4ZuU2ahcS4ivVj-n7N_oU5ZINvkTU6qAmUV72Ln4e7rS1EbfY3wy6H6XlZGRbUfaK8viPdML3bw');">
        </div>
        <!-- Gradient to ensure legibility and surface tone -->
        <div class="absolute inset-0 bg-gradient-to-br from-surface via-surface/90 to-surface-container-low/80"></div>
        <!-- Soft decorative glow -->
        <div
            class="absolute -top-40 -right-40 w-96 h-96 bg-primary-fixed-dim rounded-full mix-blend-multiply filter blur-[100px] opacity-30">
        </div>
        <div
            class="absolute -bottom-40 -left-40 w-[30rem] h-[30rem] bg-secondary-fixed rounded-full mix-blend-multiply filter blur-[120px] opacity-20">
        </div>
    </div>
    <!-- Main Content Canvas -->
    <main class="relative z-10 w-full max-w-md px-6 py-12 flex flex-col items-center">


        <!-- Floating Card -->
        <div
            class="w-full bg-surface-container-lowest rounded-3xl p-8 sm:p-12 shadow-[0_40px_60px_-10px_rgba(25,28,30,0.06)] flex flex-col items-center">

            <div class="mb-10 text-center">
                <img src="logo.png" alt="Logo Mecanosoft" class="w-30 h-25 object-contain" />
            </div>

            <div class="w-full text-center mb-8">
                <h2 class="font-headline text-2xl sm:text-3xl font-bold text-on-surface mb-4">
                    Recuperar Senha
                </h2>
                <p class="font-body text-base text-on-surface-variant leading-relaxed px-2">
                    Não se preocupe. Digite o e-mail associado à sua conta e enviaremos um link para redefinir sua
                    senha.
                </p>
            </div>
            <form [formGroup]="recoveryForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col gap-6">
                <div class="relative group w-full">
                    <label class="sr-only" for="email">Endereço de E-mail</label>
                    <div
                        class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
                        <span class="material-symbols-outlined">mail</span>
                    </div>
                    <input formControlName="email"
                        class="w-full bg-surface-container-low text-on-surface border-none rounded-md py-4 pl-12 pr-4 font-body text-base placeholder:text-on-surface-variant/70 transition-all duration-300 focus:bg-surface-container-lowest focus:ring-2 focus:ring-surface-tint focus:outline-none"
                        id="email" name="email" placeholder="Seu endereço de e-mail" required="" type="email" />
                </div>
                <button [disabled]="isLoading()"
                    class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-semibold text-lg py-4 px-6 rounded-3xl mt-2 hover:opacity-95 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed"
                    type="submit">
                    <ng-container *ngIf="!isLoading()">
                        <span>Enviar Instruções</span>
                        <span class="material-symbols-outlined text-xl">arrow_forward</span>
                    </ng-container>
                    <ng-container *ngIf="isLoading()">
                        <span class="material-symbols-outlined text-xl animate-spin">progress_activity</span>
                        <span>Enviando...</span>
                    </ng-container>
                </button>
            </form>
            <div class="mt-8 w-full text-center">
                <a class="inline-flex items-center gap-2 text-primary font-body font-medium text-sm hover:bg-primary-fixed/30 px-4 py-2 rounded-full transition-colors duration-200"
                    routerLink="/login">
                    <span class="material-symbols-outlined text-sm">arrow_back</span>
                    Voltar para o Login
                </a>
            </div>
        </div>
    </main>
</div>
