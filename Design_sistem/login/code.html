<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - The Curator</title>
<!-- Google Fonts: Manrope (Headline) & Inter (Body/Label) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@500;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Design System Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary-fixed-dim": "#a3c9ff",
                        "primary-fixed": "#d3e4ff",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-fixed": "#cbe7f5",
                        "surface-container-low": "#f2f4f6",
                        "tertiary-container": "#00544b",
                        "inverse-primary": "#a3c9ff",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#cbe7f5",
                        "on-primary-container": "#8abcff",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed-variant": "#304a55",
                        "secondary-fixed-dim": "#afcbd8",
                        "on-tertiary-container": "#63cbbb",
                        "surface-variant": "#e0e3e5",
                        "on-primary-fixed-variant": "#004882",
                        "secondary": "#48626e",
                        "inverse-surface": "#2d3133",
                        "background": "#f8f9fb",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f8f9fb",
                        "primary": "#003461",
                        "tertiary-fixed-dim": "#70d8c8",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#021f29",
                        "tertiary-fixed": "#8df5e4",
                        "on-tertiary-fixed-variant": "#005048",
                        "on-primary": "#ffffff",
                        "surface-tint": "#27609d",
                        "outline": "#727781",
                        "on-error": "#ffffff",
                        "tertiary": "#003b34",
                        "surface-bright": "#f8f9fb",
                        "surface-container-high": "#e6e8ea",
                        "outline-variant": "#c2c6d1",
                        "error-container": "#ffdad6",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#424750",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#00201c",
                        "surface-container": "#eceef0",
                        "on-primary-fixed": "#001c38",
                        "on-background": "#191c1e",
                        "on-secondary-container": "#4e6874",
                        "primary-container": "#004b87",
                        "on-error-container": "#93000a"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    fontFamily: {
                        "headline": ["Manrope", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        /* Ambient shadow utility for cards (32px blur, 6% opacity) */
        .shadow-ambient {
            box-shadow: 0 16px 32px rgba(25, 28, 30, 0.06);
        }
        /* Custom ghost border for inputs */
        .ghost-border {
            border: 1px solid rgba(194, 198, 209, 0.4); /* outline-variant approximated */
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 sm:p-8 font-body text-on-surface antialiased">
<!-- Main Container - Centered to emphasize the clean canvas -->
<main class="w-full max-w-[420px]">
<!-- Surface Card (Focus Layer) -->
<div class="bg-surface-container-lowest rounded-xl shadow-ambient p-8 sm:p-10 relative overflow-hidden">
<!-- Subtle decorative gradient at the top right to break complete sterility -->
<div class="absolute -top-16 -right-16 w-32 h-32 bg-primary-fixed-dim rounded-full blur-3xl opacity-40 pointer-events-none"></div>
<!-- Header Section -->
<div class="mb-10 relative z-10">
<div class="flex items-center gap-2 mb-6">
<!-- Conceptual Logo Symbol -->
<div class="w-8 h-8 rounded bg-gradient-to-br from-primary to-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-xl" style="font-variation-settings: 'FILL' 1;">
                            dashboard_customize
                        </span>
</div>
<span class="font-headline font-bold text-xl tracking-tighter text-primary">The Curator</span>
</div>
<h1 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-2">Entrar</h1>
<p class="font-body text-sm text-on-surface-variant">Acesse sua área de trabalho editorial.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6 relative z-10" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label text-sm font-medium text-on-surface block" for="email">E-mail corporativo</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg">mail</span>
</div>
<input class="w-full bg-surface-container-lowest text-on-surface pl-10 pr-4 py-3 rounded-lg font-body text-sm ghost-border focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all duration-200 placeholder:text-outline-variant" id="email" name="email" placeholder="seu.nome@empresa.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="font-label text-sm font-medium text-on-surface block" for="password">Senha</label>
<a class="font-label text-xs font-medium text-primary hover:text-primary-container hover:underline transition-colors" href="#">
                            Esqueceu a senha?
                        </a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-lg">lock</span>
</div>
<input class="w-full bg-surface-container-lowest text-on-surface pl-10 pr-4 py-3 rounded-lg font-body text-sm ghost-border focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed transition-all duration-200 placeholder:text-outline-variant tracking-widest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 rounded ghost-border text-primary focus:ring-primary-fixed focus:ring-offset-0 bg-surface-container-lowest cursor-pointer transition-colors" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm font-body text-on-surface-variant cursor-pointer select-none" for="remember-me">
                        Lembrar de mim
                    </label>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-label font-medium text-sm py-3 px-4 rounded-md shadow-sm hover:shadow-md hover:from-primary-container hover:to-primary transition-all duration-300 flex justify-center items-center gap-2 group" type="submit">
                    Entrar na Plataforma
                    <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform duration-200">
                        arrow_forward
                    </span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 pt-6 border-t border-surface-container-highest text-center relative z-10">
<p class="font-body text-sm text-on-surface-variant">
                    Ainda não tem acesso? 
                    <a class="font-label font-medium text-primary hover:text-primary-container hover:underline transition-colors ml-1" href="#">
                        Criar uma conta
                    </a>
</p>
</div>
</div>
<!-- Optional environmental detail outside the card -->
<div class="mt-8 text-center">
<span class="font-headline text-xs text-on-surface-variant tracking-widest uppercase opacity-60">Ambiente Seguro</span>
</div>
</main>
</body></html>
