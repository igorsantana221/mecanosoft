<div class="mb-10 text-center">
<h1 class="font-headline text-3xl font-extrabold tracking-tight text-primary">

            </h1>
</div>

<div class="w-full text-center mb-8">
<h2 class="font-headline text-2xl sm:text-3xl font-bold text-on-surface mb-4">
                    Recuperar Senha
                </h2>
<p class="font-body text-base text-on-surface-variant leading-relaxed px-2">
                    Não se preocupe. Digite o e-mail associado à sua conta e enviaremos um link para redefinir sua senha.
                </p>
</div>

<form action="#" class="w-full flex flex-col gap-6" method="POST">
<!-- Email Input Field -->
<div class="relative group w-full">
<label class="sr-only" for="email">Endereço de E-mail</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="ds-input w-full bg-surface-container-low text-on-surface border-none rounded-md py-4 pl-12 pr-4 font-body text-base placeholder:text-on-surface-variant/70 transition-all duration-300" id="email" name="email" placeholder="Seu endereço de e-mail" required="" type="email"/>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-semibold text-lg py-4 px-6 rounded-3xl mt-2 hover:opacity-95 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-2" type="submit">

<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
