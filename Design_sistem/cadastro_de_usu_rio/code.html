<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Criar Conta | Architectural Curator</title>
<!-- Google Fonts: Manrope (Headline) & Inter (Body) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#191c1e",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary": "#572500",
                        "surface-container-highest": "#e0e3e6",
                        "background": "#f7f9fc",
                        "secondary-fixed": "#d3e4ff",
                        "on-primary-container": "#8abcff",
                        "on-surface-variant": "#424750",
                        "primary": "#003461",
                        "tertiary-fixed": "#ffdbc8",
                        "on-secondary-fixed": "#081c33",
                        "primary-fixed": "#d3e4ff",
                        "secondary-container": "#cee1ff",
                        "primary-fixed-dim": "#a3c9ff",
                        "on-secondary-container": "#52647d",
                        "on-background": "#191c1e",
                        "on-tertiary-container": "#ffa46a",
                        "surface": "#f7f9fc",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#793701",
                        "surface-container": "#eceef1",
                        "on-primary-fixed-variant": "#004882",
                        "outline": "#727781",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#001c38",
                        "surface-tint": "#27609d",
                        "on-tertiary-fixed-variant": "#753400",
                        "outline-variant": "#c2c6d1",
                        "on-tertiary-fixed": "#321300",
                        "surface-container-high": "#e6e8eb",
                        "surface-container-low": "#f2f4f7",
                        "on-tertiary": "#ffffff",
                        "surface-dim": "#d8dadd",
                        "primary-container": "#004b87",
                        "tertiary-fixed-dim": "#ffb68b",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#eff1f4",
                        "secondary": "#4e5f79",
                        "on-secondary-fixed-variant": "#364860",
                        "inverse-surface": "#2d3133",
                        "surface-variant": "#e0e3e6",
                        "inverse-primary": "#a3c9ff",
                        "secondary-fixed-dim": "#b5c8e5",
                        "surface-bright": "#f7f9fc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": [
                            "Manrope",
                            "sans-serif"
                        ],
                        "body": [
                            "Inter",
                            "sans-serif"
                        ],
                        "label": [
                            "Inter",
                            "sans-serif"
                        ]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center p-4 sm:p-8 antialiased relative overflow-hidden">
<!-- Atmospheric Depth Elements -->
<div class="absolute top-[-15%] left-[-10%] w-[50vw] h-[50vw] max-w-[600px] max-h-[600px] bg-primary-fixed-dim/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-15%] right-[-10%] w-[60vw] h-[60vw] max-w-[700px] max-h-[700px] bg-secondary-fixed/30 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Centered Card Layout -->
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl p-8 sm:p-12 shadow-[0_40px_60px_-10px_rgba(25,28,30,0.06)] relative z-10 flex flex-col gap-10">
<!-- Header -->
<header class="flex flex-col items-center text-center gap-3">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">architecture</span>
<span class="font-headline font-bold text-xl tracking-tight">ArchitectCurator</span>
</div>
<div>
<h1 class="font-headline text-3xl font-extrabold text-on-surface tracking-tight mb-2">Criar conta</h1>
<p class="text-on-surface-variant text-sm font-body leading-[1.6]">Junte-se à plataforma exclusiva para profissionais de arquitetura para curadoria e gerenciamento de projetos.</p>
</div>
</header>
<!-- Form -->
<form action="#" class="flex flex-col gap-6" method="POST">
<div class="flex flex-col gap-5">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-on-surface font-label ml-1" for="fullName">Nome Completo</label>
<input class="bg-surface-container-low border-2 border-transparent text-on-surface rounded-lg px-4 py-3 focus:bg-surface-container-lowest focus:border-surface-tint focus:ring-0 transition-all duration-200 placeholder:text-outline font-body" id="fullName" name="fullName" placeholder="ex: Jane Doe" required="" type="text"/>
</div>
<!-- Email Address -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-on-surface font-label ml-1" for="email">E-mail Corporativo</label>
<input class="bg-surface-container-low border-2 border-transparent text-on-surface rounded-lg px-4 py-3 focus:bg-surface-container-lowest focus:border-surface-tint focus:ring-0 transition-all duration-200 placeholder:text-outline font-body" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-on-surface font-label ml-1" for="password">Senha</label>
<input class="bg-surface-container-low border-2 border-transparent text-on-surface rounded-lg px-4 py-3 focus:bg-surface-container-lowest focus:border-surface-tint focus:ring-0 transition-all duration-200 placeholder:text-outline font-body" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-on-surface font-label ml-1" for="confirmPassword">Confirmar Senha</label>
<input class="bg-surface-container-low border-2 border-transparent text-on-surface rounded-lg px-4 py-3 focus:bg-surface-container-lowest focus:border-surface-tint focus:ring-0 transition-all duration-200 placeholder:text-outline font-body" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start gap-3 mt-2 pl-1">
<div class="flex items-center h-5 mt-0.5">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest bg-surface-container-lowest cursor-pointer transition-colors" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant font-body leading-[1.5] cursor-pointer" for="terms">
                    Eu concordo com os 
                    <a class="text-primary hover:text-primary-container font-medium transition-colors border-b border-transparent hover:border-primary-container pb-0.5" href="#">Termos de Serviço</a> 
                    e a 
                    <a class="text-primary hover:text-primary-container font-medium transition-colors border-b border-transparent hover:border-primary-container pb-0.5" href="#">Política de Privacidade</a>.
                </label>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full py-4 px-6 rounded-xl bg-gradient-to-br from-primary to-primary-container text-on-primary font-label font-medium text-base hover:opacity-95 hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 group" type="submit">
                Criar conta
                <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform" style="font-variation-settings: 'FILL' 1;">arrow_right_alt</span>
</button>
</form>
<!-- Footer Link -->
<div class="text-center text-sm font-body text-on-surface-variant pt-2 border-t border-surface-container-high/50">
            Já tem uma conta? 
            <a class="text-primary font-semibold hover:text-primary-container transition-colors ml-1" href="#">Entrar</a>
</div>
</div>
</body></html>
