<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
      h1, h2, h3 {
        font-family: 'Manrope', sans-serif;
      }

<body class="bg-surface text-on-surface min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Suppressed per "Shell Visibility & Relevance" rule for error/404 pages) -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-6 py-24">
<!-- Error Container (Layering Principle: level 2 card on foundation) -->
<div class="relative w-full max-w-xl">
<!-- Decorative Back-light -->
<div class="absolute -top-24 -left-24 w-64 h-64 bg-primary-container/10 blur-[100px] rounded-full"></div>
<div class="absolute -bottom-24 -right-24 w-64 h-64 bg-secondary-container/20 blur-[100px] rounded-full"></div>
<section class="relative bg-surface-container-lowest p-8 md:p-14 rounded-xl shadow-[0_40px_60px_-10px_rgba(25,28,30,0.06)] text-center">
<!-- Refined Abstract Icon/Illustration -->
<div class="mb-10 flex justify-center">
<div class="relative group">
<div class="absolute inset-0 bg-primary/5 rounded-full scale-150 blur-xl"></div>
<div class="relative w-24 h-24 flex items-center justify-center bg-surface-container-low rounded-full">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="architecture" data-weight="fill" style="font-variation-settings: 'FILL' 1;">architecture</span>
</div>
</div>
</div>
<!-- Messaging -->
<div class="space-y-4 mb-12">
<h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-primary leading-tight">
                        Ops! Algo deu errado
                    </h1>
<p class="text-on-surface-variant text-lg leading-relaxed max-w-md mx-auto">
                        Ocorreu um erro inesperado. Nossa equipe já foi notificada, mas você pode tentar novamente ou entrar em contato com o suporte se o problema persistir.
                    </p>
</div>
<!-- CTA Actions -->
<div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
<button class="w-full sm:w-auto px-10 py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-semibold rounded-xl text-lg hover:shadow-lg active:scale-95 transition-all duration-300">
                        Tentar Novamente
                    </button>
<button class="w-full sm:w-auto px-10 py-4 bg-surface-container-highest text-on-surface font-semibold rounded-xl text-lg hover:bg-surface-bright active:scale-95 transition-all duration-300">
                        Falar com o Suporte
                    </button>
</div>
<!-- Visual Detail: The Ghost Border on top is not needed due to Ambient Shadows, but let's add a subtle accent -->
<div class="mt-14 pt-8 border-t border-outline-variant/15 flex justify-center gap-6 grayscale opacity-40">
<div class="w-8 h-[2px] bg-primary/20"></div>
<div class="w-8 h-[2px] bg-primary/20"></div>
<div class="w-8 h-[2px] bg-primary/20"></div>
</div>
</section>
</div>
</main>
<!-- Footer (Shared Component Anchor) -->
<footer class="w-full py-12 mt-auto bg-[#f7f9fc] dark:bg-[#191c1e]">
<div class="flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto">
<div class="mb-6 md:mb-0">
<span class="font-inter text-sm leading-relaxed text-[#44474e] dark:text-[#c2c6d1]">
                    © 2024 Architectural Curator. Todos os direitos reservados.
                </span>
</div>
<nav class="flex gap-8">

<a class="font-inter text-sm leading-relaxed text-[#44474e] dark:text-[#c2c6d1] hover:text-[#004B87] dark:hover:text-white transition-all opacity-80 hover:opacity-100" href="#">Termos</a>
<a class="font-inter text-sm leading-relaxed text-[#44474e] dark:text-[#c2c6d1] hover:text-[#004B87] dark:hover:text-white transition-all opacity-80 hover:opacity-100" href="#">Segurança</a>

</div>
